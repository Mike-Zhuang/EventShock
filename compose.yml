name: eventshock

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: "${EVENTSHOCK_APP_IMAGE:-eventshock-app:local}"
    restart: unless-stopped
    environment:
      APP_ENV: "${APP_ENV:-production}"
      EVENTSHOCK_DATA_DIR: /data
      # 只读治理接口固定读取持久卷内的最小部署证据；应用业务代码不写该文件。
      EVENTSHOCK_DEPLOYMENT_STATUS_FILE: /data/deployment-status.json
      EVENTSHOCK_RELEASE_COMMIT: "${EVENTSHOCK_RELEASE_COMMIT:-development}"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
      EVENTSHOCK_AUTH_REQUIRED: "${EVENTSHOCK_AUTH_REQUIRED:-true}"
      EVENTSHOCK_AUTH_COOKIE_SECURE: "${EVENTSHOCK_AUTH_COOKIE_SECURE:-true}"
      EVENTSHOCK_ADMIN_EMAIL: "${EVENTSHOCK_ADMIN_EMAIL:-}"
      EVENTSHOCK_AUTH_SECRET_FILE: /run/secrets/eventshock/auth-secret
      EVENTSHOCK_ADMIN_API_KEY_ENCRYPTION_KEY_FILE: /run/secrets/eventshock/admin-api-key-encryption-key
      EVENTSHOCK_SMTP_HOST: "${EVENTSHOCK_SMTP_HOST:-}"
      EVENTSHOCK_SMTP_PORT: "${EVENTSHOCK_SMTP_PORT:-465}"
      EVENTSHOCK_SMTP_USERNAME: "${EVENTSHOCK_SMTP_USERNAME:-}"
      EVENTSHOCK_SMTP_PASSWORD_FILE: /run/secrets/eventshock/smtp-password
      EVENTSHOCK_SMTP_SENDER: "${EVENTSHOCK_SMTP_SENDER:-}"
    expose:
      - "8000"
    ports:
      # 仅供宿主机上的宝塔 Nginx 反向代理；公网无法直接连接此回环端口。
      - "127.0.0.1:${EVENTSHOCK_APP_HOST_PORT:-18000}:8000"
    volumes:
      - eventshock-data:/data
      # 目录中只允许放服务器侧密钥文件；不得把真实值写进 Compose 或 Git。
      # 一次性管理员密码保持 root:root 0400，应用 UID 10001 无权读取，
      # 仅由 deploy-server.sh 通过标准输入交给引导命令。
      - "${EVENTSHOCK_SECRETS_DIR:-./.eventshock-secrets}:/run/secrets/eventshock:ro"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3).read()"
      interval: 20s
      timeout: 5s
      start_period: 20s
      retries: 5
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    cpus: 1.50
    mem_limit: 1024m
    mem_reservation: 256m
    stop_grace_period: 30s
    logging: &default-logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - app-network

  caddy:
    image: caddy:2.11.4-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    restart: unless-stopped
    # Docker 守护进程在主机重启时会并行恢复容器，不会重新执行 Compose 的
    # depends_on 顺序。先等待应用，再等待最终代理链健康，避免 Caddy 提前
    # 监听公网端口并把应用启动窗口暴露为 502。
    entrypoint:
      - /bin/sh
      - /usr/local/bin/caddy-startup-gate.sh
    command:
      - caddy
      - run
      - --config
      - /etc/caddy/Caddyfile
      - --adapter
      - caddyfile
    environment:
      APP_DOMAIN: "${APP_DOMAIN:-eventshock.mikezhuang.cn}"
      CADDY_UPSTREAM: "${CADDY_UPSTREAM:-app:8000}"
      CADDY_STARTUP_GATE_TIMEOUT_SECONDS: "${CADDY_STARTUP_GATE_TIMEOUT_SECONDS:-90}"
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80/tcp"
      - "443:443/tcp"
      - "443:443/udp"
    extra_hosts:
      # Linux 上让容器能够访问宝塔 Nginx 绑定的 Docker host-gateway 地址。
      - "host.docker.internal:host-gateway"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./scripts/caddy-startup-gate.sh:/usr/local/bin/caddy-startup-gate.sh:ro
      - caddy-data:/data
      - caddy-config:/config
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - -O
        - /dev/null
        - -T
        - "3"
        - http://127.0.0.1:2019/config/
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    cpus: 0.25
    mem_limit: 128m
    mem_reservation: 32m
    stop_grace_period: 15s
    logging: *default-logging
    networks:
      - app-network

volumes:
  eventshock-data:
    name: eventshock-data
  caddy-data:
    name: eventshock-caddy-data
  caddy-config:
    name: eventshock-caddy-config

networks:
  app-network:
    driver: bridge
